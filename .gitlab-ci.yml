stages:
  - build
  - publish

.garmin_build:
  stage: build
  tags:
    - windows
    - garmin-ci
  timeout: 30 minutes
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File tools\Invoke-CI.ps1 -Mode Release

main_release:
  extends: .garmin_build
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - bin/ci/WearTAK-Garmin*.prg
      - bin/ci/WearTAK-Garmin.iq
      - bin/ci/SHA256SUMS.txt
      - bin/ci/release-build.json
      - bin/ci/*.log
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'

official_release:
  extends: .garmin_build
  artifacts:
    when: always
    expire_in: never
    paths:
      - bin/ci/WearTAK-Garmin*.prg
      - bin/ci/WearTAK-Garmin.iq
      - bin/ci/SHA256SUMS.txt
      - bin/ci/*.log
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'

publish_default_branch:
  stage: publish
  tags:
    - windows
    - garmin-ci
  needs:
    - job: main_release
      artifacts: true
  resource_group: garmin-default-branch-publisher
  interruptible: false
  timeout: 15 minutes
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File tools\Publish-GarminRelease.ps1
  rules:
    - if: '$GARMIN_PUBLISH_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"'
